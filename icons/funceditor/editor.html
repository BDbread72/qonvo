<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>함수 에디터</title>
<link rel="stylesheet" href="vendor/codemirror.min.css">
<link rel="stylesheet" href="vendor/theme_material-darker.min.css">
<link rel="stylesheet" href="vendor/addon_hint_show-hint.min.css">
<link rel="stylesheet" href="vendor/addon_lint_lint.min.css">
<style>
  /* flexbox + 100vh 레이아웃 — absolute/height:100% 체인 의존 제거(setHtml 에서 견고). */
  html, body { margin:0; padding:0; background:#1e2228;
               color:#d7dae0; font-family:"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #bar { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 10px;
         background:#252b33; border-bottom:1px solid #333b45; }
  #bar input {
         background:#1b1f25; color:#e6e9ee; border:1px solid #3a434e;
         border-radius:4px; padding:5px 8px; font-size:13px; }
  #fnname { width:150px; }
  /* 커스텀 드롭다운 — QtWebEngine 네이티브 <select> 팝업 버그 회피(흰 박스/리사이즈 트리거). */
  .dd { position:relative; }
  .dd > button { width:150px; text-align:left; background:#1b1f25; color:#e6e9ee;
         border:1px solid #3a434e; border-radius:4px; padding:5px 8px; font-size:13px;
         cursor:pointer; }
  .dd > button:after { content:"▾"; float:right; color:#8b929c; }
  .ddlist { display:none; position:absolute; top:30px; left:0; min-width:180px; max-height:240px;
         overflow-y:auto; background:#20262e; border:1px solid #3a434e; border-radius:4px;
         z-index:50; box-shadow:0 6px 18px rgba(0,0,0,0.4); }
  .ddlist.open { display:block; }
  .ddlist .item { padding:6px 10px; font-size:13px; color:#dfe4ea; cursor:pointer; white-space:nowrap; }
  .ddlist .item:hover { background:#2f6db0; color:#fff; }
  .ddlist .item.empty { color:#7d848e; cursor:default; }
  #bar button {
         background:#2f3742; color:#dfe4ea; border:1px solid #414c59;
         border-radius:4px; padding:5px 11px; font-size:13px; cursor:pointer; }
  #bar button:hover { background:#3a4450; }
  #bar button.primary { background:#3b6ea5; border-color:#4f86c6; color:#fff; }
  #bar button.primary:hover { background:#4f86c6; }
  #bar button.danger:hover { background:#7a3b3b; border-color:#a35; }
  #spacer { flex:1; }
  #status { font-size:12px; color:#8b929c; padding-right:4px; }
  /* 에디터 영역: flex 로 남은 높이 차지 + CM 을 그 안에 절대위치로 가둔다(무한확장 방지). */
  #wrap { flex:1 1 auto; min-height:0; position:relative; overflow:hidden; }
  .CodeMirror {
    position:absolute; top:0; left:0; right:0; bottom:0;
    height:100% !important; width:100%;
    background:#1e2228; color:#d7dae0;
    font-family:Consolas,"D2Coding",monospace; font-size:14px;
  }
  #foot { flex:0 0 auto; height:24px; line-height:24px;
          background:#252b33; border-top:1px solid #333b45; color:#7d848e;
          font-size:11px; padding:0 10px; }
  /* 토큰 색 */
  .cm-qv-cmd   { color:#7cc4ff; font-weight:bold; }
  .cm-qv-sub   { color:#c2a8ff; }
  .cm-qv-macro { color:#ffcf6b; font-weight:bold; }
  .cm-qv-var   { color:#ff9e64; }
  .cm-qv-tag   { color:#9ece6a; }
  .cm-qv-str   { color:#9ece6a; }
  .cm-qv-num   { color:#e0af68; }
  .cm-qv-cmt   { color:#5c6370; font-style:italic; }
</style>
</head>
<body>
  <div id="bar">
    <div class="dd" id="dd">
      <button id="ddbtn" type="button">— 함수 선택 —</button>
      <div class="ddlist" id="ddlist"></div>
    </div>
    <span style="width:10px"></span>
    <input id="fnname" placeholder="함수 이름">
    <button id="btnSave" class="primary">저장 (Ctrl+S)</button>
    <button id="btnNew">새로</button>
    <button id="btnDelete" class="danger">삭제</button>
    <span id="spacer"></span>
    <span id="status"></span>
  </div>
  <div id="wrap"><textarea id="editor"></textarea></div>
  <div id="foot">한 줄 = 명령 하나 · <b>$</b> 로 시작하면 매크로 줄(<b>$(변수)</b> 치환) · <b>#</b> 주석 · Ctrl+Space 자동완성</div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/codemirror.min.js"></script>
  <script src="vendor/addon_mode_simple.min.js"></script>
  <script src="vendor/addon_hint_show-hint.min.js"></script>
  <script src="vendor/addon_lint_lint.min.js"></script>
  <script src="vendor/addon_edit_closebrackets.min.js"></script>
  <script src="vendor/addon_edit_matchbrackets.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
